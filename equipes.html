<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equipes · F1 Brasil</title>
<link rel="stylesheet" href="estilo.css">
<script src="menu.js"></script>
</head>
<body>
<main>
<h1>Equipes</h1>
<p class="sub" id="sub">Carregando...</p>
<select id="ano" aria-label="Escolher temporada"></select>
<div class="list" id="lista"></div>
</main>
<script>
const $=id=>document.getElementById(id);
let T={};
function mostrar(a){
 const t=T[a];
 if(!t.equipes.length){$("sub").textContent="A classificação de equipes só existe a partir de 1958.";$("lista").innerHTML="";return}
 $("sub").textContent="Classificação de equipes de "+a+" · após a rodada "+t.rodada;
 $("lista").innerHTML=t.equipes.map(e=>{
  const nomes=t.pilotos.filter(d=>d[2].split(" / ").includes(e[1])).map(d=>d[1].split(" ").slice(-1)[0]).join(" · ");
  return '<div class="row" style="--cor:'+corEquipe(e[1])+'"><span class="pos">'+e[0]+'</span><span><b>'+e[1]+'</b><small>'+(nomes?nomes+" · ":"")+e[3]+' vitória(s)</small></span><span class="pts">'+e[2]+'</span></div>';
 }).join("");
}
(async()=>{
 try{
  T=await lerDados("temporadas.json");
  const anos=Object.keys(T).sort((a,b)=>b-a);
  $("ano").innerHTML=anos.map(a=>'<option value="'+a+'">Temporada '+a+'</option>').join("");
  $("ano").onchange=e=>mostrar(e.target.value);
  mostrar(anos[0]);
 }catch(e){$("sub").textContent="Não consegui carregar os dados: "+e.message}
})();
</script>
</body>
</html>
