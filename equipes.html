<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equipes · F1 Brasil</title>
<link rel="stylesheet" href="estilo.css">
<script src="menu.js"></script>
</head>
<body>
<main>
<h1>Equipes</h1>
<p class="sub">Toque em uma equipe da temporada atual para ver a história dela.</p>
<div class="cards" id="cards"></div>
<h2>Classificação por temporada</h2>
<p class="sub" id="sub">Carregando...</p>
<select id="ano" aria-label="Escolher temporada"></select>
<div class="list" id="lista"></div>
</main>
<script>
const $=id=>document.getElementById(id);
let T={};
const lin=(p,t,s,r,c)=>'<div class="row" style="--cor:'+c+'"><span class="pos">'+p+'</span><span><b>'+t+'</b><small>'+s+'</small></span><span class="pts">'+r+'</span></div>';
function mostrar(a){
 const t=T[a];
 if(!t.equipes.length){
  $("sub").textContent="A classificação de equipes só existe a partir de 1958.";
  $("lista").innerHTML="";return}
 $("sub").textContent="Classificação de equipes de "+a+" · após a rodada "+t.rodada;
 $("lista").innerHTML=t.equipes.map(e=>{
  const ns=t.pilotos.filter(d=>d[2].split(" / ").includes(e[1]));
  const nomes=ns.map(d=>d[1].split(" ").slice(-1)[0]).join(" · ");
  return lin(e[0],e[1],(nomes?nomes+" · ":"")+e[3]+" vitória(s)",e[2],corEquipe(e[1]));
 }).join("");
}
(async()=>{
 try{
  const E=await lerDados("equipes_stats.json");
  const ord=Object.entries(E).sort((a,b)=>a[1].pos-b[1].pos);
  $("cards").innerHTML=ord.map(([id,d])=>'<a class="card" style="--cor:'+corEquipe(d.nome)+'" href="equipe.html?id='+id+'"><span class="num">'+d.pos+'º</span><b>'+d.nome+'</b><small>'+d.pontos+' pontos em 2026</small><br><small>'+d.titulos+' título(s) · '+d.vitorias+' vitórias</small></a>').join("");
 }catch(e){$("cards").innerHTML="<p class='sub'>Estatísticas ainda não carregadas.</p>"}
 try{
  T=await lerDados("temporadas.json");
  const anos=Object.keys(T).sort((a,b)=>b-a);
  $("ano").innerHTML=anos.map(a=>'<option value="'+a+'">Temporada '+a+'</option>').join("");
  $("ano").onchange=e=>mostrar(e.target.value);
  mostrar(anos[0]);
 }catch(e){$("sub").textContent="Não consegui carregar os dados: "+e.message}
})();
</script>
</body>
</html>
