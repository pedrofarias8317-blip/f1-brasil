<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 Brasil</title>
<link rel="stylesheet" href="estilo.css">
<script src="menu.js"></script>
</head>
<body>
<main>
<div class="hero" id="hero"><small>Próximo Grande Prêmio</small><h1>Carregando...</h1></div>
<h2>Horários do fim de semana (no seu fuso horário)</h2>
<div class="list" id="hor"></div>
<div class="duas">
 <div><h2>Pilotos</h2><div class="list" id="tp"></div><a class="mais" href="pilotos.html">Ver todos →</a></div>
 <div><h2>Equipes</h2><div class="list" id="te"></div><a class="mais" href="equipes.html">Ver todas →</a></div>
</div>
<h2 id="ut">Último resultado</h2>
<div class="list" id="ult"></div>
<a class="mais" href="corridas.html">Todos os resultados →</a>
</main>
<script>
const $=id=>document.getElementById(id);
const GP=n=>nomeGP(n);
const SES=[["FirstPractice","Treino livre 1"],["SecondPractice","Treino livre 2"],["ThirdPractice","Treino livre 3"],["SprintQualifying","Classificação do sprint"],["SprintShootout","Classificação do sprint"],["Sprint","Sprint"],["Qualifying","Classificação"]];
function horarios(p){
 const it=SES.filter(s=>p[s[0]]).map(s=>({n:s[1],d:new Date(p[s[0]].date+"T"+(p[s[0]].time||"12:00:00Z"))}));
 it.push({n:"Corrida",d:new Date(p.date+"T"+(p.time||"12:00:00Z"))});
 it.sort((a,b)=>a.d-b.d);
 $("hor").innerHTML=it.map(x=>'<div class="row"><span class="pos"></span><span><b>'+x.n+'</b><small>'+x.d.toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"short"})+'</small></span><span class="pts">'+x.d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})+'</span></div>').join("");
}
function contagem(prox){
  const alvo=new Date(prox.date+"T"+(prox.time||"12:00:00Z"));
  const ms=alvo-new Date();
  const d=Math.max(0,Math.floor(ms/864e5)),h=Math.max(0,Math.floor(ms%864e5/36e5)),m=Math.max(0,Math.floor(ms%36e5/6e4));
  $("hero").innerHTML='<small>Próximo Grande Prêmio · rodada '+prox.round+'</small><h1>'+GP(prox.raceName)+'</h1><p>'+prox.Circuit.circuitName+' · '+prox.Circuit.Location.locality+', '+pais(prox.Circuit.Location.country)+'</p><p>'+alvo.toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"})+' às '+alvo.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})+' (no seu horário)</p><div class="cont"><div><b>'+d+'</b><span>dias</span></div><div><b>'+h+'</b><span>horas</span></div><div><b>'+m+'</b><span>min</span></div></div>';
}
(async()=>{
 try{
  const [p,e,c,r]=await Promise.all([lerDados("pilotos.json"),lerDados("equipes.json"),lerDados("calendario.json"),lerDados("resultados.json")]);
  const sp=p.MRData.StandingsTable.StandingsLists[0],se=e.MRData.StandingsTable.StandingsLists[0];
  const corridas=c.MRData.RaceTable.Races;
  const prox=corridas.find(x=>new Date(x.date+"T"+(x.time||"12:00:00Z"))>new Date());
  if(prox){contagem(prox);horarios(prox);setInterval(()=>contagem(prox),60000)}
  else $("hero").innerHTML='<small>Temporada '+sp.season+'</small><h1>Temporada encerrada</h1><p>Veja a classificação final abaixo.</p>';
  $("tp").innerHTML=sp.DriverStandings.slice(0,5).map(d=>'<div class="row" style="--cor:'+corEquipe(d.Constructors[0]&&d.Constructors[0].name)+'"><span class="pos">'+d.position+'</span><span><b>'+d.Driver.givenName+' '+d.Driver.familyName+'</b><small>'+d.Constructors.map(x=>x.name).join(" / ")+'</small></span><span class="pts">'+d.points+'</span></div>').join("");
  $("te").innerHTML=se.ConstructorStandings.slice(0,5).map(t=>'<div class="row" style="--cor:'+corEquipe(t.Constructor.name)+'"><span class="pos">'+t.position+'</span><span><b>'+t.Constructor.name+'</b><small>'+t.wins+' vitória(s)</small></span><span class="pts">'+t.points+'</span></div>').join("");
  const rod=Object.keys(r).sort((a,b)=>a-b);
  if(rod.length){
   const u=r[rod[rod.length-1]];
   $("ut").textContent="Último resultado · "+GP(u.raceName);
   $("ult").innerHTML=u.Results.slice(0,5).map(x=>'<div class="row" style="--cor:'+corEquipe(x.Constructor.name)+'"><span class="pos">'+x.position+'</span><span><b>'+x.Driver.givenName+' '+x.Driver.familyName+'</b><small>'+x.Constructor.name+'</small></span><span class="pts">'+(x.Time?x.Time.time:x.status)+'</span></div>').join("");
  }
 }catch(err){$("hero").innerHTML='<h1>Erro</h1><p>Não consegui carregar os dados: '+err.message+'</p>'}
})();
</script>
</body>
</html>
