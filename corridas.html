<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corridas · F1 Brasil</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icone-180.png"><meta name="theme-color" content="#15151e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="F1 Brasil"><link rel="stylesheet" href="estilo.css">
<script src="menu.js"></script>
<style>
.abas{display:flex;gap:8px;margin:12px 0}
.abas button{font:inherit;cursor:pointer;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-weight:600}
.abas button.on{background:var(--red);border-color:var(--red);color:#fff}
</style>
</head>
<body>
<main>
<h1>Corridas</h1>
<p class="sub" id="sub">Carregando...</p>
<select id="gp" aria-label="Escolher corrida"></select>
<div class="grade" id="resumo"></div>
<div id="abas"></div>
<div class="list" id="lista"></div>
<p class="nota" id="nota"></p>
</main>
<script>
const $=id=>document.getElementById(id);
let R={},D={},rodada="",aba="corrida";
const lin=(p,t,s,r,c)=>'<div class="row" style="--cor:'+c+'"><span class="pos">'+p+'</span><span><b>'+t+'</b><small>'+s+'</small></span><span class="pts">'+r+'</span></div>';
const nome=d=>d.givenName+" "+d.familyName;
function resumo(c){
 const g=c.Results.find(x=>x.grid==="1");
 const fl=c.Results.find(x=>x.FastestLap&&x.FastestLap.rank==="1");
 const k=[["Vencedor",nome(c.Results[0].Driver)],["Pole",g?nome(g.Driver):"—"]];
 k.push(["Volta mais rápida",fl?nome(fl.Driver)+" ("+fl.FastestLap.Time.time+")":"—"]);
 $("resumo").innerHTML=k.map(x=>'<div class="k"><small>'+x[0]+'</small><b style="font-size:1rem">'+x[1]+'</b></div>').join("");
}
function mostrar(){
 const c=R[rodada],d=D[rodada]||{quali:[],pits:[]};
 $("sub").textContent=c.Circuit.circuitName+" · "+c.Circuit.Location.locality+", "+pais(c.Circuit.Location.country)+" · "+new Date(c.date+"T12:00:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"long",year:"numeric"});
 resumo(c);
 document.querySelectorAll(".abas button").forEach(b=>b.classList.toggle("on",b.dataset.a===aba));
 $("nota").textContent="";
 const vazio=t=>lin("",t,"","","#888");
 if(aba==="corrida"){
  $("lista").innerHTML=c.Results.map(x=>lin(x.position,nome(x.Driver),x.Constructor.name+" · largou em "+(x.grid==="0"?"box":x.grid+"º")+(x.Time?" · "+x.Time.time:" · "+x.status),x.points,corEquipe(x.Constructor.name))).join("");
 }else if(aba==="quali"){
  $("lista").innerHTML=d.quali.map(x=>lin(x[0],x[1],x[2],x[5]||x[4]||x[3]||"—",corEquipe(x[2]))).join("")||vazio("Classificação ainda não disponível.");
  $("nota").textContent="À direita, o melhor tempo da última fase que o piloto disputou (Q3, Q2 ou Q1).";
 }else{
  const nomes={};
  c.Results.forEach(x=>{nomes[x.Driver.driverId]=[nome(x.Driver),x.Constructor.name]});
  $("lista").innerHTML=d.pits.map(p=>{const n=nomes[p[0]]||[p[0],""];return lin(p[2],n[0],n[1]+" · parada "+p[1],p[3],corEquipe(n[1]))}).join("")||vazio("Sem dados de pit stops para esta corrida.");
  $("nota").textContent="À esquerda, a volta em que cada parada aconteceu. À direita, a duração.";
 }
}
(async()=>{
 try{
  R=await lerDados("resultados.json");
  try{D=await lerDados("detalhes.json")}catch(e){D={}}
  const rod=Object.keys(R).sort((a,b)=>b-a);
  $("gp").innerHTML=rod.map(r=>'<option value="'+r+'">Rodada '+r+' · '+nomeGP(R[r].raceName)+'</option>').join("");
  $("abas").className="abas";
  $("abas").innerHTML='<button data-a="corrida">Corrida</button><button data-a="quali">Classificação</button><button data-a="pits">Pit stops</button>';
  document.querySelectorAll(".abas button").forEach(b=>{b.onclick=()=>{aba=b.dataset.a;mostrar()}});
  $("gp").onchange=e=>{rodada=e.target.value;mostrar()};
  rodada=rod[0];mostrar();
 }catch(e){$("sub").textContent="Não consegui carregar os dados: "+e.message}
})();
</script>
</body>
</html>
