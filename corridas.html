<!DOCTYPE html>
<html lang="pt-BR">
<head><link rel="stylesheet" href="estilo.css"><script src="menu.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corridas · F1 Brasil</title>
<style>
:root{--bg:#f4f4f6;--panel:#fff;--ink:#15151e;--mute:#6b6b7b;--line:#dcdce4;--red:#e10600}
@media (prefers-color-scheme:dark){:root{--bg:#0c0c10;--panel:#16161d;--ink:#f2f2f6;--mute:#9a9aad;--line:#2a2a36}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:18px 14px 48px}
a{color:var(--red);font-weight:600}
h1{font-size:1.8rem;margin:8px 0 4px}
.sub{color:var(--mute);margin:0 0 14px}
select{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);margin-bottom:12px}
.list{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.pos{font-weight:800;color:var(--mute)}
.row small{display:block;color:var(--mute);font-size:.78rem}
.pts{font-weight:800;text-align:right}
</style>
</head>
<body>
<main>
<h1>Resultados das corridas</h1>
<p class="sub" id="sub">Carregando...</p>
<select id="gp" aria-label="Escolher corrida"></select>
<div class="list" id="lista"></div>
</main>
<script>
const $=id=>document.getElementById(id);
let R={};
function mostrar(r){
 const c=R[r];
 $("sub").textContent=c.Circuit.circuitName+" · "+c.Circuit.Location.locality+", "+pais(c.Circuit.Location.country)+" · "+new Date(c.date+"T12:00:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"long",year:"numeric"});
 $("lista").innerHTML=c.Results.map(x=>`<div class="row"><span class="pos">${x.position}</span><span><b>${x.Driver.givenName} ${x.Driver.familyName}</b><small>${x.Constructor.name} · largou em ${x.grid==="0"?"box":x.grid+"º"}${x.Time?" · "+x.Time.time:" · "+x.status}</small></span><span class="pts">${x.points}</span></div>`).join("");
}
(async()=>{
 try{
  R=await (await fetch("dados/resultados.json")).json();
  const rodadas=Object.keys(R).sort((a,b)=>b-a);
  $("gp").innerHTML=rodadas.map(r=>`<option value="${r}">Rodada ${r} · ${nomeGP(R[r].raceName)}</option>`).join("");
  $("gp").onchange=e=>mostrar(e.target.value);
  mostrar(rodadas[0]);
 }catch(err){$("sub").textContent="Não consegui carregar os dados: "+err.message}
})();
</script>
</body>
</html>
